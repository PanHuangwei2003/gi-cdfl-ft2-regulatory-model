name: pttft2_env

channels:
  - conda-forge
  - nodefaults

dependencies:
  # Python core
  - python=3.12
  - numpy=2.5.2
  - pandas=3.0.5
  - scipy=1.18.0
  - matplotlib=3.10.9

  # Deep learning (CUDA)
  - pytorch=2.13.0
  - cuda-version=12.9

  # R
  - r-base=4.3.3
  - r-tidyr=1.3.1
  - r-dplyr=1.1.4
  - r-minpack.lm=1.2_4
  - r-ggplot2=3.5.2

  # Python package manager
  - pip
